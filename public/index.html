<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ENEISOFT Pipeline Demo</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <header>
      <h1 id="main-message">Cargando...</h1>
      <p id="subtitle" class="subtitle"></p>
    </header>

    <section class="info-grid" id="info-grid">
      <div class="card" id="build-card">
        <h3>Build</h3>
        <div class="card-content" id="build-info">Cargando...</div>
      </div>
      <div class="card" id="runtime-card">
        <h3>Runtime</h3>
        <div class="card-content" id="runtime-info">Cargando...</div>
      </div>
      <div class="card" id="k8s-card">
        <h3>Kubernetes</h3>
        <div class="card-content" id="k8s-info">Cargando...</div>
      </div>
      <div class="card" id="pipeline-card">
        <h3>Pipeline</h3>
        <div class="card-content" id="pipeline-info">Cargando...</div>
      </div>
    </section>

    <footer>
      <p>ENEISOFT XVI - Pipeline DevSecOps Demo</p>
    </footer>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
