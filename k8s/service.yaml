apiVersion: v1
kind: Service
metadata:
  name: eneisoft-demo-service
  namespace: eneisoft-demo
  labels:
    app: eneisoft-demo
    app.kubernetes.io/name: eneisoft-demo
    app.kubernetes.io/component: loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: eneisoft-demo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
